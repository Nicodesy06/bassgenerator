name: delete-release

# Manual maintenance: deletes a GitHub Release and its tag (e.g. a withdrawn version).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to delete (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
