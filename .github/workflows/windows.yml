name: build-and-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 (MSVC, VST3)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Configure (JUCE 9.0.5 via FetchContent)
        run: cmake --preset windows-x64-release

      - name: Build Release x64
        run: cmake --build --preset windows-x64-release --parallel

      - name: List artefacts
        shell: pwsh
        run: Get-ChildItem -Recurse "build/windows-x64/GrooveForgeBass_artefacts/Release" | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300

      - name: CTest (unit, statistics, MIDI, scheduler, DSP, state, favorites, VST3 host harness, GUI bindings)
        run: ctest --preset windows-x64-release --output-on-failure

      - name: Generator diagnostics + golden demos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/reports | Out-Null
          ./build/windows-x64/tools/Release/pattern_diagnostics.exe --count 200 --out artifacts/reports
          ./build/windows-x64/tools/Release/render_demo.exe --out artifacts/reports/demos

      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1

      # pluginval (Tracktion, GPLv3) is downloaded from its official GitHub release page
      # only inside CI to validate the built bundle; it is not shipped with the plugin.
      - name: Download pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval -Force
          $pv = (Get-ChildItem -Recurse pluginval -Filter pluginval.exe | Select-Object -First 1).FullName
          & $pv --version
          "PV=$pv" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: pluginval strictness 10 (full, out-of-process)
        id: pv_full
        continue-on-error: true
        shell: cmd
        run: >
          "%PV%" --strictness-level 10 --verbose --output-dir artifacts\pluginval-full
          "build\windows-x64\GrooveForgeBass_artefacts\Release\VST3\GrooveForge Bass.vst3"

      - name: pluginval strictness 10 (non-GUI tests)
        id: pv_nogui
        continue-on-error: true
        shell: cmd
        run: >
          "%PV%" --strictness-level 10 --skip-gui-tests --verbose --output-dir artifacts\pluginval-nogui
          "build\windows-x64\GrooveForgeBass_artefacts\Release\VST3\GrooveForge Bass.vst3"

      # Informational (does not fail the job): in-process mode crashed in "Editor Automation"
      # on earlier runs while out-of-process mode passes; kept visible until resolved.
      - name: pluginval strictness 10 (in-process, informational)
        id: pv_inproc
        continue-on-error: true
        shell: cmd
        run: >
          "%PV%" --strictness-level 10 --validate-in-process --output-dir artifacts\pluginval-inprocess
          "build\windows-x64\GrooveForgeBass_artefacts\Release\VST3\GrooveForge Bass.vst3"

      - name: pluginval logs
        if: always()
        shell: pwsh
        run: Get-ChildItem artifacts -Recurse -Filter *.txt | Where-Object { $_.FullName -like '*pluginval*' } | ForEach-Object { Write-Host "==== $($_.FullName)"; Get-Content $_.FullName -Tail 80 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GrooveForgeBass-win64
          path: |
            dist/*.zip
            dist/*.sha256
            artifacts/
            build/windows-x64/Testing/Temporary/LastTest.log
          if-no-files-found: warn

      - name: Fail job if pluginval failed
        if: steps.pv_full.outcome == 'failure' || steps.pv_nogui.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "pluginval full: ${{ steps.pv_full.outcome }}  non-GUI: ${{ steps.pv_nogui.outcome }}"
          exit 1

  linux:
    name: Linux (GCC, VST3 + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libgl1-mesa-dev xvfb
      - name: Configure
        run: cmake --preset linux-release
      - name: Build
        run: cmake --build --preset linux-release --parallel
      - name: Test
        run: xvfb-run -a ctest --preset linux-release --output-on-failure
